<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense & Budget Visualizer</title>
  <!-- Menghubungkan CSS -->
  <link rel="stylesheet" href="css/style.css">
  <!-- Library Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

  <div class="app-container">
    <h1 class="app-title">Expense & Budget Visualizer</h1>

    <!-- Total Balance Card -->
    <div class="card balance-card">
      <span class="balance-label">TOTAL BALANCE</span>
      <div id="total-balance" class="balance-value">$0.00</div>
    </div>

    <!-- Form Add Transaction -->
    <div class="card form-card">
      <h2>Add Transaction</h2>
      <form id="transaction-form">
        <div class="form-group">
          <label>Item Name</label>
          <input type="text" id="item-name" placeholder="e.g. Cilok" required>
        </div>
        <div class="form-group">
          <label>Amount</label>
          <input type="number" id="item-amount" step="0.01" placeholder="14.94" required>
        </div>
        <div class="form-group">
          <label>Category</label>
          <select id="item-category" required>
            <option value="Food">Food</option>
            <option value="Transport">Transport</option>
            <option value="Fun">Fun</option>
          </select>
        </div>
        <button type="submit" class="btn-submit">Add Transaction</button>
      </form>
    </div>

    <!-- Bottom Section: List & Chart Side-by-Side -->
    <div class="bottom-grid">
      <!-- Transactions List -->
      <div class="card list-card">
        <h2>Transactions</h2>
        <div id="transaction-list" class="transaction-list">
          <!-- Transaksi muncul di sini -->
        </div>
      </div>

      <!-- Spending Chart -->
      <div class="card chart-card">
        <h2>Spending by Category</h2>
        <div class="chart-wrapper">
          <canvas id="spending-chart"></canvas>
        </div>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
